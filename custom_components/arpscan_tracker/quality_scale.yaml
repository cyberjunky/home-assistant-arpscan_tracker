rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration has no actions.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: The integration has no actions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: todo
  entity-event-setup:
    status: exempt
    comment: Entities only follow the coordinator.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: todo
    comment: The flow checks that the interface has a network, but doesn't run a test scan.
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: The integration has no actions.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: No authentication is used.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: The integration scans the local network, it isn't discovered.
  discovery:
    status: exempt
    comment: The integration scans the local network, it isn't discovered.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category: done
  entity-device-class:
    status: exempt
    comment: Device trackers have no device class.
  entity-disabled-by-default: done
  entity-translations:
    status: exempt
    comment: Entities are named after their device.
  exception-translations: todo
  icon-translations:
    status: exempt
    comment: Device trackers use the default icons.
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: There are no issues the user can repair.
  stale-devices:
    status: done
    comment: Devices can be removed by the user; a device is never known to be gone for good.

  # Platinum
  async-dependency:
    status: exempt
    comment: scapy needs a worker process (select() file descriptor limit), see probe.py.
  inject-websession:
    status: exempt
    comment: No HTTP is used.
  strict-typing: todo
